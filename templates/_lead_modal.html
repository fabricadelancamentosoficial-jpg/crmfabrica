<div class="modal-backdrop" id="lead-modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 id="lead-modal-title">Novo lead</h3>
      <button type="button" class="modal-close" id="lead-modal-close" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="lead-form">
      <input type="hidden" id="f-id" value="">
      <div class="field-grid">
        <div class="field"><label>Nome</label><input type="text" id="f-nome" required placeholder="Dra. Nome Completo"></div>
        <div class="field"><label>Área de atuação</label><input type="text" id="f-area" placeholder="Ex: Odontologia"></div>
        <div class="field">
          <label>Telefone / WhatsApp</label>
          <div class="field-with-action">
            <input type="text" id="f-telefone" placeholder="5548999998888">
            <a href="#" target="_blank" id="f-whatsapp-link" class="field-action" title="Abrir no WhatsApp" style="display:none;">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2.003c-5.53 0-10.02 4.49-10.02 10.02 0 1.77.46 3.5 1.34 5.02L2 22l5.11-1.34a9.98 9.98 0 0 0 4.93 1.31h.01c5.53 0 10.02-4.49 10.02-10.02 0-2.68-1.04-5.19-2.93-7.08a9.96 9.96 0 0 0-7.1-2.9zm0 1.67c2.24 0 4.35.87 5.94 2.46a8.35 8.35 0 0 1 2.45 5.9c0 4.61-3.75 8.36-8.36 8.36a8.33 8.33 0 0 1-4.24-1.16l-.3-.18-3.03.8.81-2.95-.2-.3a8.32 8.32 0 0 1-1.27-4.43c0-4.61 3.75-8.36 8.36-8.36l-.16-.14z"/></svg>
            </a>
          </div>
        </div>
        <div class="field"><label>Origem</label><input type="text" id="f-origem" placeholder="Formulário de aplicação"></div>
        <div class="field"><label>Ticket proposto (R$)</label><input type="number" id="f-ticket" min="0" step="500" value="0"></div>
        <div class="field">
          <label>Responsável</label>
          <select id="f-responsavel">
            <option value="">Sem responsável</option>
            {% for r in responsaveis %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
          </select>
        </div>
        <div class="field">
          <label>Etapa</label>
          <select id="f-etapa">
            {% for e in etapas %}<option value="{{ e }}">{{ e }}</option>{% endfor %}
          </select>
        </div>
        <div class="field"><label>Último contato</label><input type="date" id="f-ultimo-contato"></div>
        <div class="field"><label>Próximo follow-up</label><input type="datetime-local" id="f-proximo-follow-up"></div>
      </div>
      <div class="field" id="f-motivo-wrap" style="display:none;">
        <label>Motivo da perda</label>
        <input type="text" id="f-motivo-perda" placeholder="Ex: orçamento, timing, concorrente...">
      </div>
      <div class="field">
        <label>Notas</label>
        <textarea id="f-notas" rows="3" placeholder="Observações sobre a conversa, objeções, próximos passos..."></textarea>
      </div>
      <div class="field" id="f-history-wrap" style="display:none;">
        <label>Histórico</label>
        <div class="history-list" id="f-history-list"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="danger-outline" id="lead-delete-btn" style="display:none;">Excluir lead</button>
        <div class="modal-actions-right">
          <button type="button" class="ghost" id="lead-cancel-btn">Cancelar</button>
          <button type="submit" class="btn-primary" id="lead-save-btn">Salvar</button>
        </div>
      </div>
    </form>
  </div>
</div>
