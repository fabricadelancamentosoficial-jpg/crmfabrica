<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fábrica · Aplicação enviada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#0a1620; --bg-2:#0d1e29; --bg-3:#102532;
  --surface: rgba(19,42,53,.55); --line: rgba(140,190,210,.16); --line-strong: rgba(140,190,210,.28);
  --ink:#eaf4f8; --ink-soft:#9db9c2; --ink-faint:#5f818b;
  --accent:#5fb6e0; --accent-soft:#bfe6f4; --glow: rgba(95,182,224,.30);
  --good:#52d19e; --good-soft: rgba(82,209,158,.14);
}
*{box-sizing:border-box;}
html{ background: var(--bg-2); }
body{
  margin:0; min-height:100vh; font-family:'Inter',system-ui,sans-serif; color:var(--ink);
  background-color: var(--bg-2);
  background-image:
    radial-gradient(900px 500px at 20% -10%, var(--glow), transparent 60%),
    linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  display:flex; align-items:center; justify-content:center; padding: 24px;
}
.wrap{ max-width: 480px; width:100%; text-align:center; }
.brand-word{ font-family:'Sora'; font-weight:700; font-size:20px; letter-spacing:-.01em; display:block; margin-bottom: 30px;
  background: linear-gradient(135deg, #ffffff, var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent; }

.card{
  background: var(--surface); border:1px solid var(--line); border-radius: 24px; padding: 40px 34px;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 1px 1px rgba(255,255,255,.04) inset, 0 30px 60px -30px rgba(0,0,0,.6);
}
.check{
  width:52px; height:52px; border-radius:50%; background: var(--good-soft); color: var(--good);
  display:flex; align-items:center; justify-content:center; margin: 0 auto 20px;
}
.check svg{ width:26px; height:26px; }
h1{ font-family:'Sora'; font-weight:700; font-size:24px; margin: 0 0 12px; letter-spacing:-.01em; }
p{ font-size:14.5px; color: var(--ink-soft); line-height:1.6; margin: 0 0 30px; }

.actions{ display:flex; flex-direction:column; gap:12px; }
.btn{
  display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px;
  border-radius:14px; border:none; font-family:'Sora'; font-weight:700; font-size:14.5px; cursor:pointer; text-decoration:none;
}
.btn svg{ width:18px; height:18px; }
.btn-primary{ background: linear-gradient(135deg, var(--accent), #3a8fb0); color:#06161d; box-shadow: 0 14px 28px -12px var(--glow); }
.btn-ghost{ background: transparent; border:1px solid var(--line-strong); color: var(--ink-soft); }
.btn:disabled{ opacity:.55; cursor:default; }

.confirm-msg{ font-size:13.5px; color: var(--good); font-weight:600; margin-top: 18px; display:none; }
.confirm-msg.visible{ display:block; }
</style>
</head>
<body>
<div class="wrap">
  <span class="brand-word">fábrica<sup>&reg;</sup></span>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Aplicação recebida, {{ primeiro_nome }}!</h1>
    <p>Recebemos seus dados. Quer que a gente já fale com você agora, ou prefere que a nossa equipe entre em contato mais tarde?</p>

    <div class="actions">
      {% if whatsapp_link %}
      <a href="{{ whatsapp_link }}" target="_blank" rel="noopener" class="btn btn-primary" id="btn-agora">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2.003c-5.53 0-10.02 4.49-10.02 10.02 0 1.77.46 3.5 1.34 5.02L2 22l5.11-1.34a9.98 9.98 0 0 0 4.93 1.31h.01c5.53 0 10.02-4.49 10.02-10.02 0-2.68-1.04-5.19-2.93-7.08a9.96 9.96 0 0 0-7.1-2.9z"/></svg>
        Quero falar agora
      </a>
      {% endif %}
      <button type="button" class="btn btn-ghost" id="btn-depois">Prefiro mais tarde</button>
    </div>

    <div class="confirm-msg" id="confirm-msg">Combinado — nossa equipe entra em contato em breve 🙂</div>
  </div>
</div>
<script>
  var leadId = "{{ lead.id }}";
  function registrar(pref) {
    fetch("/api/aplicar/" + leadId + "/preferencia", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ preferencia: pref }),
    }).catch(function () {});
  }
  var btnAgora = document.getElementById("btn-agora");
  if (btnAgora) btnAgora.addEventListener("click", function () { registrar("Quer falar agora"); });

  var btnDepois = document.getElementById("btn-depois");
  btnDepois.addEventListener("click", function () {
    registrar("Prefere mais tarde");
    btnDepois.disabled = true;
    btnDepois.textContent = "Combinado!";
    document.getElementById("confirm-msg").classList.add("visible");
  });
</script>
</body>
</html>
