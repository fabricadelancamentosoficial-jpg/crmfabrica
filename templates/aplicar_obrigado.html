<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fábrica · Aplicação enviada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#0a1620; --bg-2:#0d1e29; --bg-3:#102532;
  --surface: rgba(19,42,53,.55); --line: rgba(140,190,210,.16); --line-strong: rgba(140,190,210,.28);
  --ink:#eaf4f8; --ink-soft:#9db9c2; --ink-faint:#5f818b;
  --accent:#5fb6e0; --accent-soft:#bfe6f4; --glow: rgba(95,182,224,.30);
  --good:#52d19e; --good-soft: rgba(82,209,158,.14);
  --warm:#c9a876; --warm-deep:#9c7c4d; --warm-glow: rgba(201,168,118,.28);
}
*{box-sizing:border-box;}
html{ background: var(--bg-2); }
body{
  margin:0; min-height:100vh; font-family:'Inter',system-ui,sans-serif; color:var(--ink);
  background-color: var(--bg-2);
  background-image:
    radial-gradient(900px 500px at 20% -10%, var(--glow), transparent 60%),
    linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  display:flex; align-items:center; justify-content:center; padding: 24px;
}
.wrap{ max-width: 880px; width:100%; text-align:center; }
.brand-word{ font-family:'Sora'; font-weight:700; font-size:20px; letter-spacing:-.01em; display:block; margin-bottom: 30px;
  background: linear-gradient(135deg, #ffffff, var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent; }

.card{
  background: var(--surface); border:1px solid var(--line); border-radius: 28px; padding: 52px 56px;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 1px 1px rgba(255,255,255,.04) inset, 0 30px 60px -30px rgba(0,0,0,.6);
}
.check{
  width:60px; height:60px; border-radius:50%; background: var(--good-soft); color: var(--good);
  display:flex; align-items:center; justify-content:center; margin: 0 auto 22px;
}
.check svg{ width:30px; height:30px; }
h1{ font-family:'Instrument Serif', serif; font-weight:400; font-size:40px; margin: 0 0 16px; letter-spacing:-.005em; }
h1 em{ font-style: italic;
  background: linear-gradient(135deg, var(--warm), #e8cfa0); -webkit-background-clip:text; background-clip:text; color:transparent; }
p{ font-size:16px; color: var(--ink-soft); line-height:1.6; margin: 0 0 34px; }

.actions{ display:flex; flex-direction:column; gap:12px; max-width:460px; margin:0 auto; }
.btn{
  display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px;
  border-radius:999px; border:none; font-family:'Sora'; font-weight:700; font-size:14.5px; cursor:pointer; text-decoration:none;
}
.btn svg{ width:18px; height:18px; }
.btn-primary{ background: linear-gradient(135deg, var(--warm), var(--warm-deep)); color:#1c1608; box-shadow: 0 14px 28px -12px var(--warm-glow); }
.btn:disabled{ opacity:.55; cursor:default; }

.confirm-msg{ font-size:13.5px; color: var(--good); font-weight:600; margin-top: 18px; display:none; }
.confirm-msg.visible{ display:block; }

.vsl-section{ margin: 8px 0 40px; }
.vsl-frame{ position:relative; width:100%; padding-top:56.25%; border-radius:18px; overflow:hidden; background:#000; box-shadow: 0 40px 70px -30px rgba(0,0,0,.7); }
.vsl-frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }

.cta-heading{ font-family:'Instrument Serif', serif; font-weight:400; font-size:32px; margin: 0 0 22px; letter-spacing:-.005em; color: var(--warm); }
.btn-big{ font-size:17px; padding:20px; letter-spacing:.03em; }

@media (max-width: 720px){
  .card{ padding: 34px 24px; }
  h1{ font-size: 30px; }
  .cta-heading{ font-size: 25px; }
}
</style>
</head>
<body>
<div class="wrap">
  <span class="brand-word">fábrica<sup>&reg;</sup></span>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Aplicação recebida, <em>{{ primeiro_nome }}</em>!</h1>
    <p>Entenda como funciona:</p>

    {% if vsl_url %}
    <div class="vsl-section">
      <div class="vsl-frame"><iframe src="{{ vsl_url }}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
    </div>
    {% endif %}

    <h2 class="cta-heading">Agende seu diagnóstico gratuito</h2>
    <div class="actions">
      {% if calendly_url %}
      <a href="{{ calendly_url }}" target="_blank" rel="noopener" class="btn btn-primary btn-big" id="btn-agendar">AGENDAR AGORA</a>
      {% elif whatsapp_link %}
      <a href="{{ whatsapp_link }}" target="_blank" rel="noopener" class="btn btn-primary btn-big" id="btn-agendar">FALAR NO WHATSAPP</a>
      {% endif %}
    </div>

    <div class="confirm-msg" id="confirm-msg">Combinado — te esperamos por lá 🙂</div>
  </div>
</div>
<script>
  var leadId = "{{ lead.id }}";
  var btnAgendar = document.getElementById("btn-agendar");
  if (btnAgendar) {
    btnAgendar.addEventListener("click", function () {
      fetch("/api/aplicar/" + leadId + "/preferencia", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ preferencia: "Quer falar agora", horario: "" }),
      }).catch(function () {});
      document.getElementById("confirm-msg").classList.add("visible");
    });
  }
</script>
</body>
</html>
