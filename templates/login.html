<!doctype html>
<html lang="pt-BR" data-theme="{{ theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Fábrica CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-screen">
    <div class="login-bg-fx"></div>
    <button type="button" class="theme-toggle login-theme-toggle" id="theme-toggle" aria-label="Alternar tema">
      <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <form class="login-card" method="post" action="{{ url_for('login') }}">
      <div class="login-logo">
        <span class="mark">F</span>
        <span class="word">fábrica<sup>&reg;</sup></span>
      </div>
      <div class="login-sub">Acesse o CRM comercial</div>

      <div class="field">
        <label>Quem é você?</label>
        <div class="name-pick" id="name-pick">
          {% for r in responsaveis %}
          <button type="button" class="name-btn {{ 'selected' if r == nome else '' }}" data-name="{{ r }}">{{ r }}</button>
          {% endfor %}
        </div>
        <input type="hidden" name="nome" id="nome-input" value="{{ nome or '' }}">
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Senha do CRM" autocomplete="current-password" autofocus>
      </div>

      {% if erro %}<div class="login-error">{{ erro }}</div>{% endif %}

      <button type="submit" class="login-submit">
        Entrar
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <div class="login-foot">Acesso restrito à equipe Fábrica</div>
    </form>
  </div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
  document.querySelectorAll('#name-pick .name-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#name-pick .name-btn').forEach(function (b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      document.getElementById('nome-input').value = btn.getAttribute('data-name');
    });
  });
</script>
</body>
</html>
